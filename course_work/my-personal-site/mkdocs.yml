site_name: "Сайт Марии"
site_description: "Личный сайт - тест - блог по дисциплине 'Введение в веб-технологии'"
site_author: "Шумакова Мария Денисовна"
site_url: ""

theme:
  name: material
  logo: images/logo.png
  favicon: images/logo.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: pink
      toggle:
        icon: material/weather-night
        name: "Тёмная тема"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: "Светлая тема"

nav:
  - Главная: index.md
  - О себе: about.md
  - Проекты: projects.md
  - Достижения: achievements.md
  - Резюме: resume.md
  - Контакты: contacts.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - footnotes
  - codehilite
  - def_list
  - attr_list
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - tags

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/
      name: GitHub
    - icon: fontawesome/brands/telegram
      link: https://t.me/
      name: Telegram
  generator: false
  copyright:
    text: "Сайт Марии © 2025"
